<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Straddle P&amp;F</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/kite/static/trading.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1 id="brand-title" title="Point &amp; Figure on 1-min closes, 0.5% box, 3-box reversal">Straddle P&amp;F</h1>
    </div>

    <select class="index-select" id="underlying" aria-label="Index" title="Index"></select>

    <div class="stats">
      <div class="stat" id="spot-stat">
        <span class="label">Spot</span>
        <span class="value" id="spot">&ndash;</span>
        <span class="chg" id="spot-chg"></span>
      </div>
      <div class="stat" id="fut-stat">
        <span class="label">Fut</span>
        <span class="value" id="fut">&ndash;</span>
        <span class="chg" id="fut-chg"></span>
      </div>
    </div>

    <form class="controls" id="config" autocomplete="off">
      <label class="field expiry-field">
        <span>Expiry</span>
        <select id="expiry" aria-label="Expiry"></select>
      </label>
      <label class="field">
        <span>ATM</span>
        <input id="atm" type="number" step="50" min="1000" max="100000" inputmode="numeric" required>
      </label>
      <button type="button" class="chip" id="atm-auto" aria-pressed="true" title="Use the strike nearest to today's NIFTY open">
        Auto
      </button>
      <button type="submit" class="btn primary" id="apply" hidden>Apply</button>
    </form>

    <div class="view-menu">
      <button type="button" class="btn view-btn" id="view-btn" aria-haspopup="true" aria-expanded="false" aria-controls="view-panel" title="Overlays, box size and days of history">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>
        </svg>
        View
        <svg class="caret" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="view-panel" id="view-panel" role="group" aria-label="View" hidden>
        <div class="view-overlays" id="overlays">
          <label class="view-check" title="Intraday VWAP of the straddle: CE + PE price weighted by CE + PE volume since 09:15">
            <input type="checkbox" data-overlay="vwap"><span>VWAP</span><i class="swatch vwap" aria-hidden="true"></i>
          </label>
          <label class="view-check" title="Midpoints of the last 10 columns, each weighted by the CE + PE volume traded while it formed">
            <input type="checkbox" data-overlay="vwma"><span>VWMA 10</span><i class="swatch vwma" aria-hidden="true"></i>
          </label>
        </div>
        <div class="view-row">
          <span class="view-label" id="zoom-label">Box size</span>
          <div class="zoom" role="group" aria-labelledby="zoom-label">
            <button type="button" class="icon-btn" id="zoom-out" title="Smaller boxes">&minus;</button>
            <button type="button" class="icon-btn fit" id="zoom-fit" title="Fit boxes to height">Fit</button>
            <button type="button" class="icon-btn" id="zoom-in" title="Bigger boxes">+</button>
          </div>
        </div>
        <div class="view-row">
          <label class="view-label" for="days">Days</label>
          <select class="view-select" id="days" title="Trading sessions of history"></select>
        </div>
      </div>
    </div>

    <div class="zoom alert-tools" role="group" aria-label="Alerts">
      <button type="button" class="icon-btn sound" id="sound" aria-pressed="true" title="Alert sounds on">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          <path class="mute-slash" d="M3 3l18 18"/>
        </svg>
      </button>
      <button type="button" class="icon-btn log" id="alert-log-btn" aria-expanded="false" aria-controls="alert-log" title="Alert log (last 30)">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>
        </svg>
        <span class="badge" id="alert-badge" hidden></span>
      </button>
    </div>

    <div class="feed">
      <span class="pill" id="feed-pill"><i></i><span></span></span>
      <form class="login" id="login" hidden autocomplete="off">
        <input id="totp" inputmode="numeric" pattern="\d{6}" maxlength="6" placeholder="TOTP" aria-label="6-digit TOTP" autocomplete="one-time-code" required>
        <button type="submit" class="btn primary" id="login-btn">Go live</button>
      </form>
      <button type="button" class="btn" id="go-live" hidden>Go live</button>
    </div>
  </header>

  <div class="banner" id="banner" hidden>
    <span id="banner-text"></span>
    <button type="button" class="btn" id="banner-action" hidden></button>
  </div>

  <main class="charts" id="charts"></main>

  <template id="panel-template">
    <section class="panel">
      <header class="panel-head">
        <div class="ph-main">
          <div class="ph-title"><span class="ph-offset"></span><span class="ph-strike"></span></div>
          <div class="ph-legs"></div>
        </div>
        <div class="ph-quote">
          <div class="ph-price">&ndash;</div>
          <div class="ph-chg"></div>
        </div>
      </header>
      <div class="ph-meta"><span class="ph-meta-text"></span><span class="ph-signal" hidden></span></div>
      <div class="plot">
        <canvas></canvas>
        <div class="scroller"><div class="spacer"></div></div>
        <div class="plot-msg" hidden></div>
      </div>
    </section>
  </template>

  <div class="tooltip" id="tooltip" hidden></div>
  <div class="toasts" id="toasts" aria-live="assertive"></div>

  <section class="alert-log" id="alert-log" role="dialog" aria-label="Alert log" hidden>
    <header class="alert-log-head">
      <h2>Alert log</h2>
      <span class="alert-log-sub">last 30 signals and errors</span>
      <button type="button" class="toast-close" id="alert-log-close" aria-label="Close">&times;</button>
    </header>
    <ol class="alert-log-list" id="alert-log-list"></ol>
    <p class="alert-log-empty" id="alert-log-empty">No alerts yet. Double bottom sell alerts (straddle below VWAP) and errors (e.g. an order not placed) appear here as they happen; the last 30 are kept.</p>
  </section>
</body>
</html>
